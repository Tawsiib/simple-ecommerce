<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bg)" rx="12" ry="12"/>
  
  <!-- Jar -->
  <ellipse cx="150" cy="180" rx="60" ry="80" fill="url(#jar)" stroke="#d97706" stroke-width="3"/>
  
  <!-- Jar lid -->
  <ellipse cx="150" cy="100" rx="65" ry="25" fill="#92400e" stroke="#78350f" stroke-width="2"/>
  
  <!-- Cream inside jar -->
  <ellipse cx="150" cy="180" rx="55" ry="70" fill="url(#cream)" opacity="0.8"/>
  
  <!-- Jar label -->
  <rect x="120" y="140" width="60" height="40" fill="#fbbf24" rx="4" ry="4" stroke="#d97706" stroke-width="1"/>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#92400e" font-weight="bold">LUXURY</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#92400e" font-weight="bold">SKINCARE</text>
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#92400e">CREAM</text>
  
  <!-- Product name -->
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">Refreshing Toner</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="80" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="220" cy="80" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="80" cy="220" r="4" fill="#fbbf24" opacity="0.6"/>
  <circle cx="220" cy="220" r="4" fill="#fbbf24" opacity="0.6"/>
</svg>
